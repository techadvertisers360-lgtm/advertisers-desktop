<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Advertisers360 Agent</title>
    <style>
      body {
        margin: 0;
        padding: 28px 28px 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #ffffff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      p {
        margin: 0 0 14px;
        font-size: 14px;
        line-height: 1.5;
        color: #4b5563;
      }
      ol {
        margin: 0 0 20px;
        padding-left: 20px;
        font-size: 14px;
        line-height: 1.7;
      }
      a.button {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #1d4ed8;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      .note {
        margin-top: 14px;
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <h1>One quick setting</h1>
    <p>System Settings is open. Please turn on <b>Advertisers360 Agent</b>:</p>
    <ol>
      <li>Find <b>Advertisers360 Agent</b> in the list</li>
      <li>Switch it <b>on</b> (enter your Mac password if asked)</li>
    </ol>
    <a class="button" href="x-apple.systempreferences:com.apple.preference.security?Privacy_ScreenCapture" target="_blank"
      >Open Settings again</a
    >
    <p class="note">The agent restarts by itself once it's on — you don't need to do anything else.</p>
  </body>
</html>
