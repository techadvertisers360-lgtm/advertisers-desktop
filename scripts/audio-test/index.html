<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Voice recorder test</title>
  </head>
  <body>
    <script>
      // Mirrors useVoiceRecorder.ts's exact recording logic, to test with a
      // real (fake-device-generated) audio stream instead of a stub file.
      async function run() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

          const audioCtx = new AudioContext();
          const source = audioCtx.createMediaStreamSource(stream);
          const analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64;
          source.connect(analyser);

          const chunks = [];
          const recorder = new MediaRecorder(stream);
          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) chunks.push(e.data);
          };

          const stopped = new Promise((resolve) => {
            recorder.onstop = resolve;
          });

          recorder.start();
          window.testAPI.reportResult({ status: "recording-started" });

          await new Promise((r) => setTimeout(r, 3000));
          recorder.stop();
          await stopped;

          stream.getTracks().forEach((t) => t.stop());
          audioCtx.close();

          const blob = new Blob(chunks, { type: "audio/webm" });
          const arrayBuffer = await blob.arrayBuffer();
          const bytes = new Uint8Array(arrayBuffer);
          let binary = "";
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          const base64 = btoa(binary);

          window.testAPI.reportResult({
            status: "done",
            size: blob.size,
            type: blob.type,
            chunkCount: chunks.length,
            base64,
          });
        } catch (err) {
          window.testAPI.reportResult({ status: "error", message: err.message, stack: err.stack });
        }
      }
      run();
    </script>
  </body>
</html>
